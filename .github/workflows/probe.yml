name: Probe release tag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Что видит метка latest-apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          tag=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "User-Agent: BPDiary" \
            "repos/${GITHUB_REPOSITORY}/releases/tags/latest-apk" \
            --jq '[.assets[].name] | join(",")')
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest-apk" --jq .id)
          byid=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${id}/assets" --jq '[.[].name] | join(",")')
          body=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${id}" --jq '.body' | head -1)
          echo "::warning::TAG=${tag}"
          echo "::warning::ID=${byid}"
          echo "::warning::BODY=${body}"
