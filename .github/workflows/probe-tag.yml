name: Probe tag assets

on:
  push:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Новая метка держит файл
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          repo="$GITHUB_REPOSITORY"
          gh release delete asset-probe --yes --cleanup-tag --repo "$repo" >/dev/null 2>&1 || true
          printf 'probe\n' > "$RUNNER_TEMP/probe.txt"
          if ! gh release create asset-probe "$RUNNER_TEMP/probe.txt" --title probe --notes probe --repo "$repo"; then
            echo "::error::create failed"
            exit 1
          fi
          id=$(gh api "repos/${repo}/releases/tags/asset-probe" --jq .id)
          echo "created $id, waiting"
          sleep 90
          tag=$(gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "User-Agent: BPDiary" \
            "repos/${repo}/releases/tags/asset-probe" --jq '[.assets[].name] | join(",")' || true)
          byid=$(gh api "repos/${repo}/releases/${id}/assets" --jq '[.[].name] | join(",")' || true)
          echo "::warning::TAG=${tag}"
          echo "::warning::ID=${byid}"
          echo "TAG=${tag}"
          echo "ID=${byid}"
