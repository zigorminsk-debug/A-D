name: Build APK (Дневник АД)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # v3 по умолчанию ставит снятый пакет tools и падает с exit 1.
      - name: Установить Android SDK
        uses: android-actions/setup-android@v4

      - name: Платформа Android 34
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          {
            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
            command -v sdkmanager || true
            : "${ANDROID_HOME:?ANDROID_HOME не задан}"
            yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
            sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0"
            test -d "$ANDROID_HOME/platforms/android-34"
            test -d "$ANDROID_HOME/build-tools/34.0.0"
            echo PLATFORM_OK
          } > "$GITHUB_WORKSPACE/dist/sdk.log" 2>&1
          cat "$GITHUB_WORKSPACE/dist/sdk.log"

      - name: Собрать APK постоянным ключом
        working-directory: bp-diary-app
        run: |
          set -euo pipefail
          test -f keystore/bp-diary.keystore
          chmod +x gradlew
          # Пароли не передаём: пустой Secret затёр бы ключ.
          # Gradle сам берёт keystore/bp-diary.keystore и пароль постоянного ключа.
          unset BP_KEYSTORE_PASSWORD BP_KEY_ALIAS BP_KEY_PASSWORD || true
          : "${ANDROID_HOME:?ANDROID_HOME не задан}"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          # Куча из gradle.properties (1G) тесна для AGP 8 на раннере.
          sed -i 's/-Xmx1024m/-Xmx2048m/; s/-XX:MaxMetaspaceSize=384m/-XX:MaxMetaspaceSize=512m/; s/kotlin.daemon.jvmargs=-Xmx512m/kotlin.daemon.jvmargs=-Xmx1024m/' gradle.properties
          mkdir -p "$GITHUB_WORKSPACE/dist"
          set +e
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace \
            > "$GITHUB_WORKSPACE/dist/gradle.log" 2>&1
          code=$?
          set -e
          tail -n 80 "$GITHUB_WORKSPACE/dist/gradle.log"
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/dist/BPDiary-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/BPDiary-release.apk"

      - name: Сохранить лог сборки при ошибке
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          logf=dist/gradle.log
          if [ ! -f "$logf" ]; then
            logf=dist/sdk.log
          fi
          if [ ! -f "$logf" ]; then
            echo "::error::лог сборки не создан"
            exit 0
          fi
          cp "$logf" dist/ci-failure.log
          # Аннотации читаются через API, даже если архив логов Azure недоступен.
          grep -E 'FAILURE:|What went wrong|Execution failed|error:|e: |Caused by:|SDK location|Failed to find|Could not|A problem' dist/ci-failure.log \
            | tail -n 30 \
            | while IFS= read -r line; do
                echo "::error::${line}"
              done
          python3 - << 'PY'
          import json, os, urllib.request
          log = open("dist/ci-failure.log", errors="replace").read().splitlines()
          keys = ("FAILURE:", "What went wrong", "Execution failed", "error:", "e: ", "Caused by:", "SDK location", "Failed to find", "Could not", "A problem")
          picked = [l for l in log if any(k in l for k in keys)]
          body = "Gradle CI failure\n\n```\n" + "\n".join((picked[-40:] + ["---"] + log[-80:])) + "\n```"
          body = body[-60000:]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['GITHUB_SHA']}/comments",
              data=json.dumps({"body": body}).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print("comment", resp.status)
          except Exception as exc:
              print("comment failed", exc)
          PY

      - name: Загрузить артефакт APK
        uses: actions/upload-artifact@v4
        with:
          name: BPDiary-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Опубликовать APK в Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Первые строки читает приложение (AppUpdater). Не убирать versionCode.
          gradle_file=bp-diary-app/app/build.gradle
          code=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' "$gradle_file" | head -1)
          name=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' "$gradle_file" | head -1)
          test -n "$code"
          test -n "$name"
          sha=$(sha256sum dist/BPDiary-release.apk | awk '{print $1}')
          test "${#sha}" -eq 64
          printf '{"versionCode":%s,"versionName":"%s","sha256":"%s"}\n' "$code" "$name" "$sha" > dist/version.json
          {
            printf 'versionCode: %s\n' "$code"
            printf 'versionName: %s\n' "$name"
            printf 'sha256: %s\n' "$sha"
            printf 'Автосборка %s (%s). Оба файла подписаны постоянным ключом bp-diary-app/keystore/bp-diary.keystore (alias bpdiary). Обновление ставится поверх без удаления данных. Для установки берите BPDiary-release.apk.\n' "$GITHUB_SHA" "$GITHUB_REF_NAME"
          } > dist/release-notes.txt
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk \
            dist/BPDiary-release.apk \
            dist/BPDiary-debug.apk \
            dist/version.json \
            --title "Дневник АД — последний APK" \
            --notes-file dist/release-notes.txt

      - name: Краткий итог
        run: |
          {
            echo "### APK собран постоянным ключом"
            echo "Скачать: артефакт **BPDiary-APK** и релиз \`latest-apk\`."
            echo "Ключ не менять: \`bp-diary-app/keystore/bp-diary.keystore\`."
            echo "Установленное приложение само проверяет релиз \`latest-apk\` и предлагает более новый versionCode."
          } >> "$GITHUB_STEP_SUMMARY"
