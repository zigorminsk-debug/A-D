# Этот файл срабатывает, только если репозиторием является сама папка bp-diary-app.
# В монорепозитории A-D сборку запускает корневой .github/workflows/android.yml.
name: Build APK (Дневник АД)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # v3 по умолчанию ставит снятый пакет tools и падает с exit 1.
      - name: Установить Android SDK
        uses: android-actions/setup-android@v4

      - name: Платформа Android 34
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME не задан}"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"

      - name: Собрать APK постоянным ключом
        run: |
          set -euo pipefail
          test -f keystore/bp-diary.keystore
          chmod +x gradlew
          unset BP_KEYSTORE_PASSWORD BP_KEY_ALIAS BP_KEY_PASSWORD || true
          : "${ANDROID_HOME:?ANDROID_HOME не задан}"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          sed -i 's/-Xmx1024m/-Xmx2048m/; s/-XX:MaxMetaspaceSize=384m/-XX:MaxMetaspaceSize=512m/; s/kotlin.daemon.jvmargs=-Xmx512m/kotlin.daemon.jvmargs=-Xmx1024m/' gradle.properties
          mkdir -p dist
          set +e
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace > dist/gradle.log 2>&1
          code=$?
          set -e
          tail -n 80 dist/gradle.log
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk dist/BPDiary-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/BPDiary-release.apk

      - name: Загрузить артефакт APK
        uses: actions/upload-artifact@v4
        with:
          name: BPDiary-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Опубликовать APK в Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)
          name=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          test -n "$code"
          test -n "$name"
          sha=$(sha256sum dist/BPDiary-release.apk | awk '{print $1}')
          test "${#sha}" -eq 64
          printf '{"versionCode":%s,"versionName":"%s","sha256":"%s"}\n' "$code" "$name" "$sha" > dist/version.json
          {
            printf 'versionCode: %s\n' "$code"
            printf 'versionName: %s\n' "$name"
            printf 'sha256: %s\n' "$sha"
            printf 'Автосборка %s. Подпись — постоянный ключ keystore/bp-diary.keystore (alias bpdiary). Обновление ставится поверх. Ставьте BPDiary-release.apk.\n' "$GITHUB_SHA"
          } > dist/release-notes.txt
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk \
            dist/BPDiary-release.apk \
            dist/BPDiary-debug.apk \
            dist/version.json \
            --title "Дневник АД — последний APK" \
            --notes-file dist/release-notes.txt
