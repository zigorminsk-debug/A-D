plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ─────────────────────────────────────────────────────────────
// ПОСТОЯННЫЙ КЛЮЧ ПОДПИСИ
// Один и тот же ключ (keystore/bp-diary.keystore) используется
// для debug- и release-сборок локально и в GitHub Actions,
// поэтому обновления приложения всегда устанавливаются ПОВЕРХ
// предыдущей версии без удаления данных.
// Пароли можно переопределить через переменные окружения
// (например, GitHub Secrets): BP_KEYSTORE_PASSWORD, BP_KEY_ALIAS, BP_KEY_PASSWORD
// ─────────────────────────────────────────────────────────────
// Пустая переменная (так GitHub Actions подставляет незаданный Secret) не должна
// затирать пароль постоянного ключа. Иначе CI подпишет другим ключом или упадёт,
// и обновление не встанет поверх уже установленного приложения.
def envOr = { String name, String fallback ->
    def v = System.getenv(name)
    (v == null || v.trim().isEmpty()) ? fallback : v.trim()
}
def ksFile = rootProject.file("keystore/bp-diary.keystore")
if (!ksFile.isFile()) {
    throw new GradleException(
        "Нет постоянного ключа keystore/bp-diary.keystore. " +
        "Не создавайте новый keystore: обновления должны ставиться ПОВЕРХ установленной версии."
    )
}
def ksStorePass = envOr("BP_KEYSTORE_PASSWORD", "BPdiary2026")
def ksAlias = envOr("BP_KEY_ALIAS", "bpdiary")
def ksKeyPass = envOr("BP_KEY_PASSWORD", ksStorePass)

android {
    namespace 'com.arena.bpdiary'
    compileSdk 34

    defaultConfig {
        applicationId "com.arena.bpdiary"
        minSdk 24
        targetSdk 34
        versionCode 47         // при каждом обновлении увеличивать на 1
        versionName "1.46"
    }

    signingConfigs {
        appSign {
            storeFile ksFile
            storePassword ksStorePass
            keyAlias ksAlias
            keyPassword ksKeyPass
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.appSign
        }
        debug {
            // debug-сборка тоже подписывается постоянным ключом,
            // чтобы CI-сборка ставилась поверх локальной и наоборот
            signingConfig signingConfigs.appSign
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
